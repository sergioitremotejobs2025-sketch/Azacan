  name: libro-mind
---
apiVersion: v1
kind: Secret
metadata:
  name: libro-mind-secrets
  namespace: libro-mind
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres_password"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: libro-mind-config
